<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ECA7BA" />
		<link rel="icon" href="/favicon.ico" type="image/x-icon" />
		<title>FindYourDate - Find Your Perfect Prom Match</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
		<!-- The logo is on almost every screen; fetch it alongside the app bundle -->
		<link rel="preload" as="image" href="/images/logo.webp" type="image/webp" fetchpriority="high" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
